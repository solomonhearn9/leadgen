name: Send daily digest

on:
  schedule:
    # 12:00 UTC = 8am ET during Eastern Daylight Time (roughly Mar-Nov).
    # During Eastern Standard Time (roughly Nov-Mar) this fires at 7am ET
    # instead, since GitHub Actions cron doesn't follow DST. Shift to
    # "0 13 * * *" in winter if you want it exact, or just leave it --
    # an hour of drift twice a year is rarely worth worrying about.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python -m src.run_digest

      - name: Commit cleared buffer
        run: |
          git config user.name "lead-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Clear buffer after digest [skip ci]"
          git push
